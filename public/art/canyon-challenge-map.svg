<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1100"><title>The open canyon — authored challenge map</title><desc>Authored example schematic matching this world. Original character, collectible and destination artwork is reused unchanged. Dashed bridge in the canyon is a suggested edit, not an existing object. This is not a model interpretation.</desc><rect width="100%" height="100%" fill="#fffdf5"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3 0 6" fill="none" stroke="#8c6250" stroke-width="1.5"/></marker></defs><g font-family="system-ui,sans-serif"><text x="55" y="65" font-size="36" font-weight="650" fill="#35473a">The open canyon</text><text x="55" y="103" font-size="19" fill="#4e6050">Take the canyon trail, or build a bridge to make your own route. All three sparks are optional; reach Bo's</text><text x="55" y="128" font-size="19" fill="#4e6050">workshop.</text><text x="55" y="163" font-size="15" fill="#64705e">Authored challenge map · example, not an AI interpretation</text><path d="M450 684H1000" stroke="#a36d4c" stroke-width="4" stroke-dasharray="14 12"/><text x="725" y="650" text-anchor="middle" font-size="21" fill="#805d48">Suggested edit: add a bridge here</text><path d="M505 775V940M530 930l-25 24-25-24" fill="none" stroke="#9a735b" stroke-width="3"/><text x="625" y="870" text-anchor="middle" font-size="21" fill="#805d48">Existing lower trail →</text><rect x="0" y="690" width="450" height="410" rx="3" fill="#f4e5d7" stroke="#8c6250" stroke-width="3"/><rect x="1000" y="690" width="440" height="410" rx="3" fill="#f4e5d7" stroke="#8c6250" stroke-width="3"/><rect x="450" y="990" width="550" height="110" rx="3" fill="#f4e5d7" stroke="#8c6250" stroke-width="3"/><rect x="800" y="890" width="110" height="26" rx="3" fill="#f4e5d7" stroke="#8c6250" stroke-width="3"/><rect x="910" y="790" width="90" height="26" rx="3" fill="#f4e5d7" stroke="#8c6250" stroke-width="3"/><rect x="180" y="601" width